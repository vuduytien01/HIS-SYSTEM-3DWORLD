# Deploy story (ticket 14): Postgres cho production.
# Dev local trên máy không có Docker dùng SQLite qua DATABASE_URL="file:dev.db".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?điền qua .env}
      POSTGRES_DB: hospital
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
